plugins { id 'com.android.application' }
android {
    namespace 'app.thesystem.mobile'
    compileSdk 36
    defaultConfig { applicationId 'app.thesystem.mobile'; minSdk 30; targetSdk 36; versionCode 1; versionName '0.1.0-alpha' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
